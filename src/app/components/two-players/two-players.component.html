<div class="container">
  <div class="card">
    <h2 class="title">Play against a friend!</h2>

    <div class="section">
      <p class="section-title">Join a Room</p>
      <input matInput [formControl]="roomId" class="input"/>
      <button class="join-button" (click)="joinRoom()">Join Room</button>
    </div>

    <div class="section">
      <p class="section-title">Or</p>
      <button class="create-button" (click)="createRoom()">Create New Room</button>
    </div>
  </div>
</div>
