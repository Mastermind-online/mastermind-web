<!-- home.component.html -->
<div class="container">
  <div class="card">
    <!-- Main welcome title -->
    <h1 class="title">Master Mind</h1>
    
    <p class="subtitle">The classic board game made digital to play alone or online with your friends.</p>

    <!-- Button linking to join lobby page -->
    <div class="buttons">
        <div class="game-types-div">
            <button routerLink="/one-player" routerLinkActive="active" class="game-type-button single-player-button">One Player</button>
            <button routerLink="/select-role" routerLinkActive="active" class="game-type-button two-players-button">Two Players</button>
        </div>
        <button (click)="modal.openRules()" class="game-type-button rules-button">How to play</button>
    </div>
    <app-rules-modal #modal></app-rules-modal>
  </div>
</div>
