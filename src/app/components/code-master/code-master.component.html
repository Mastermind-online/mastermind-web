<div class="container">
  <div class="card">
    <h2 class="title">You're the code master!</h2>
    <p>create the combination</p>

    

<!-- COLOR POOL -->
<div 
    cdkDropList 
    #colorPoolList="cdkDropList"
    [cdkDropListData]="colorPool" 
    [cdkDropListConnectedTo]="[secretComboList]" 
    (cdkDropListDropped)="dropInColorPool($event)" 
    style="display:flex; justify-content: space-around;">
    <div 
        *ngFor="let color of colorPool" 
        class="circle color" 
        [ngStyle]="{backgroundColor: color}"
        [cdkDragData]="color" 
        cdkDrag></div>
</div>

<div 
    cdkDropList 
    #secretComboList="cdkDropList"
    [cdkDropListData]="secretCombo" 
    [cdkDropListConnectedTo]="[colorPoolList]" 
    (cdkDropListDropped)="dropInSecretCombo($event)"
    class="combination">
    
    <div class="combination" >

    <div 
        *ngFor="let color of secretCombo" 
        class="circle color" 
        [ngStyle]="{backgroundColor: color}"
        [cdkDragData]="color" 
        cdkDrag
        class="circle circle-combination"></div>

</div>

</div>

    <div *ngFor="let attempt of attempts">
        <p>color: {{attempt.color}}</p>
        <p>container: {{attempt.container}}</p>
    </div>
  </div>
</div>
