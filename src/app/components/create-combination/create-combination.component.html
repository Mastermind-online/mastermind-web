<div class="container">
    <div class="card">
        <h2 class="title">You're the code master!</h2>
        <p class="subtitle">Create the combination to get a room ID:</p>
        <div cdkDropList #colorPoolList="cdkDropList" [cdkDropListData]="colorPool"
            [cdkDropListConnectedTo]="[secretCombinationList]" (cdkDropListDropped)="drop($event)"
            cdkDropListOrientation="horizontal" style="display:flex; justify-content: space-around;">
            <div *ngFor="let color of colorPool" class="circle color" [ngStyle]="{backgroundColor: color}" cdkDrag></div>
        </div>

        <div class="combination-div">
            <div cdkDropList #secretCombinationList="cdkDropList" [cdkDropListData]="secretCombo"
                [cdkDropListConnectedTo]="[colorPoolList]" cdkDropListOrientation="horizontal" class="combination"
                (cdkDropListDropped)="drop($event)">
                <div *ngFor="let secretColor of secretCombo" class="circle color" [ngStyle]="{backgroundColor: secretColor}"cdkDrag></div>
            </div>
            <button (click)="ready()">Ready!</button>
        </div>
    </div>
</div>
