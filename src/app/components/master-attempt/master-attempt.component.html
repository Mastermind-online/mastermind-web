<div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;">

    <p>{{attemptNumber}}</p>

    <div class="attempt">
        <div *ngFor="let color of colors; let i = index"
        [style.background-color]="color.backgroundColor"
        class="circle color">
        </div>
    </div>

    <div class="clues">
        <div *ngFor="let clue of clues; let i = index"
        [style.background-color]="clue.backgroundColor"
        (click)="setColor(i)"
        class="clues-circle">
        </div>
    </div>

    <button (click)="sendClues()">send</button>
</div>
